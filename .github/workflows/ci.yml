name: ci-sonarcloud

on:
  pull_request:
    branches: [main]

jobs:
  run-ci:
    runs-on: ubuntu

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Go
        uses: actions/setup-go@v3
        with:
          go-version: 1.25.3

      - name: Run Tests
        run: go test --coverprofile=coverage.out
