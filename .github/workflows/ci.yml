name: ci-sonarcloud

on:
  pull_request:
    branches: [main, develop]

jobs:
  run-ci:
    runs-on: ubuntu

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Go
        uses: actions/setup-go@v3
        with:
          go-version: 1.25.3

      - name: Run Tests
        run: go test --coverprofile=coverage.out

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
